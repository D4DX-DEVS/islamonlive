<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#31094c">
    <title>Islamonlive Admin · Offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      body { box-sizing: border-box; display: grid; min-height: 100dvh; margin: 0; padding: 24px; place-items: center; }
      main { width: min(100%, 440px); box-sizing: border-box; border: 1px solid #e2e8f0; border-radius: 24px; background: #fff; padding: 32px 24px; text-align: center; box-shadow: 0 12px 36px rgb(15 23 42 / 10%); }
      .brand { color: #6d28d9; font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: 10px 0 8px; font-size: 26px; line-height: 1.1; }
      p { margin: 0; color: #64748b; line-height: 1.6; }
      button { min-height: 44px; margin-top: 24px; border: 0; border-radius: 12px; padding: 0 18px; background: #6d28d9; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Islamonlive</div>
      <h1>Admin workspace is offline</h1>
      <p>Reconnect to the internet to sign in and manage WordPress articles. Your saved admin session and content are not stored for offline editing.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
